<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guess the Word</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header><a class="brand" href="/">Guess the Word</a></header>
<main>
  <p th:if="${okMessage}" th:text="${okMessage}" class="flash ok"></p>
  <p th:if="${errorMessage}" th:text="${errorMessage}" class="flash error"></p>
  <form method="post" th:action="@{/login}" class="card">
    <h2>Log in</h2>
    <label>Username <input name="username" required autofocus></label>
    <label>Password
      <div class="pw-wrap">
        <input id="pw" name="password" type="password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('pw', this)">Show</button>
      </div>
    </label>
    <button type="submit">Log in</button>
    <p>New player? <a th:href="@{/register}">Register</a></p>
  </form>
</main>
<script>
  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    btn.textContent = showing ? "Show" : "Hide";
  }
</script>
</body>
</html>
