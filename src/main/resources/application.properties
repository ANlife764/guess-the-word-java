spring.application.name=guess-the-word

# Persistent, file-based H2 database (survives restarts, like the SQLite file in the Python version).
spring.datasource.url=jdbc:h2:file:./data/gamedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Handy GUI for "viewing the database": http://localhost:8080/h2-console
# JDBC URL to paste in: jdbc:h2:file:./data/gamedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
server.port=8081
